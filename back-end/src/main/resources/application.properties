# Public portfolio configuration: externalised credentials, 2026-09-19.
# database name
spring.application.name=oceansense
# address of database (Supabase)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oceansense}

# super user
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate (JPA tool) will not interfere with existing tables
# schema.sql contains primary table structure
spring.jpa.hibernate.ddl-auto=none

# Debugging - prints SQL query in console
spring.jpa.show-sql=true

# runs schema.sql on startup
spring.sql.init.mode=always


spring.jpa.open-in-view=false

# tell Spring to look for multiple data files
spring.sql.init.data-locations=classpath:data-mapping.sql

# Avoid MaxClientsInSessionMode error by dropping 10 conn reservations
# of HikariPool to 5
# Check if a connection is still alive before trying to use it
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=5

# How long to wait for a connection from the pool (30 seconds)
spring.datasource.hikari.connection-timeout=30000

# Close idle connections after 1 minute to stay under Supabase limits
spring.datasource.hikari.idle-timeout=60000

# Max life of a connection (30 mins) - prevents "Stale Connection" errors
spring.datasource.hikari.max-lifetime=1800000

# Periodically "poke" the database so it doesn't close the door
spring.datasource.hikari.keepalive-time=30000

# --- SPATIAL SUPPORT ---
# Ensure Hibernate knows it's talking to a PostGIS database
#spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect